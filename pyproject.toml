[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.1.0"
description = "Self-hosted agent-to-agent coordination hub with human oversight"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "segno>=1.6",
]

[project.urls]
Homepage = "https://github.com/marcellobardus/agent-bridge"
Issues = "https://github.com/marcellobardus/agent-bridge/issues"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bridgectl = "bridge.cli:main"
agent-bridge = "bridge.serve:main"

[tool.setuptools]
packages = ["bridge", "bridge.db", "bridge.domain", "bridge.api", "bridge.web"]

[tool.setuptools.package-data]
"bridge.db" = ["migrations/*.sql"]
"bridge.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
