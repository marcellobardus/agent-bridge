name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"
  # sha256 of gitleaks_8.21.2_linux_x64.tar.gz (from the release's checksums file)
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies (hash-pinned) and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install "pytest>=8" "httpx>=0.27"
          python -m pip install --no-deps -e .
      - name: Tests
        run: python -m pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --config .gitleaks.toml --exit-code 1 .'
      - name: Scan working tree
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --config .gitleaks.toml --exit-code 1 .'
